[package]
name = "pulsar"
version = "0.0.1"
edition = "2021"
description = "Pulsar Bend CLI: extracts numeric facts from a TypeScript repo and renders engine findings"
publish = false

[[bin]]
name = "pulsar"
path = "src/main.rs"

[dependencies]
oxc_allocator = "0.157.0"
oxc_ast = "0.157.0"
oxc_ast_visit = "0.157.0"
oxc_parser = "0.157.0"
oxc_semantic = "0.157.0"
oxc_span = "0.157.0"
oxc_syntax = "0.157.0"
oxc_resolver = "11.24.3"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlite3-parser = "0.17"
pg_query = "6"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
sha2 = "0.10"
toml = "0.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
