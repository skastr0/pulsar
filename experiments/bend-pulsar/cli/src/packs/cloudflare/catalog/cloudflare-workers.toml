  { sym = "global#DurableObjectState", class = "query", via = "yield", use = "member:storage.sql.exec", ver = "workers-types-4", at = "@cloudflare/workers-types@4.20260120.0:index.d.ts:3492", doc = "signature: exec<T extends Record<string, SqlStorageValue>>(query: string, ...bindings: any[]): SqlStorageCursor<T>;" },
