# Cloudflare Workers pack catalog: the platform's D1 and Durable Object SQL surfaces and the
# module-level `env` import. Framework-specific: switched on by evidence, never by default.
# One entry per line, sorted by (sym, via, use, ver). at: the declaration line that justifies the
# class in @cloudflare/workers-types; doc starts with "signature:" when the line has no prose.
format = "pulsar-catalog 0"
id = "cloudflare-workers"
scope = "pack"
activate = ["dep:@cloudflare/workers-types", "dep:wrangler", "file:wrangler.json", "file:wrangler.jsonc", "file:wrangler.toml", "import:cloudflare:*"]
sources = ["@cloudflare/workers-types@4.20260120.0 index.d.ts"]

aliases = [
]

# Fixed class ids from FACTS.md; the rule id is reported with every finding that uses the class.
classes = [
  { class = "query", id = 1, rule = "cloudflare-workers/query" },
  { class = "ambient-read", id = 8, rule = "cloudflare-workers/ambient-read" },
]

# D1, Durable Object SQL storage and `env` have no module to import a symbol from: the types are
# ambient globals. `global#<Type>` with via = "yield" means a parameter or const annotated with
# that type (the same rule as a value bound from `yield* S`), and `use` names the method path.
# `this` inside a class that extends an imported symbol is a value bound from that symbol, so
# `this.ctx.storage.sql.exec(...)` in a Durable Object subclass matches the DurableObject entry.
symbols = [
  { sym = "cloudflare:workers#DurableObject", class = "query", via = "yield", use = "member:ctx.storage.sql.exec", ver = "workers-types-4", at = "@cloudflare/workers-types@4.20260120.0:index.d.ts:11380", doc = "signature: protected ctx: DurableObjectState<Props>;" },
  { sym = "cloudflare:workers#env", class = "ambient-read", via = "ref", ver = "workers-types-4", at = "@cloudflare/workers-types@4.20260120.0:index.d.ts:11472", doc = "signature: export const env: Cloudflare.Env;" },
  { sym = "global#D1Database", class = "query", via = "yield", use = "member:batch", ver = "workers-types-4", at = "@cloudflare/workers-types@4.20260120.0:index.d.ts:10536", doc = "signature: batch<T = unknown>(statements: D1PreparedStatement[]): Promise<D1Result<T>[]>;" },
  { sym = "global#D1Database", class = "query", via = "yield", use = "member:exec", ver = "workers-types-4", at = "@cloudflare/workers-types@4.20260120.0:index.d.ts:10537", doc = "signature: exec(query: string): Promise<D1ExecResult>;" },
  { sym = "global#D1Database", class = "query", via = "yield", use = "member:prepare", ver = "workers-types-4", at = "@cloudflare/workers-types@4.20260120.0:index.d.ts:10535", doc = "signature: prepare(query: string): D1PreparedStatement;" },
  { sym = "global#DurableObjectState", class = "query", via = "yield", use = "member:storage.sql.exec", ver = "workers-types-4", at = "@cloudflare/workers-types@4.20260120.0:index.d.ts:3492", doc = "signature: exec<T extends Record<string, SqlStorageValue>>(query: string, ...bindings: any[]): SqlStorageCursor<T>;" },
  { sym = "global#DurableObjectStorage", class = "query", via = "yield", use = "member:sql.exec", ver = "workers-types-4", at = "@cloudflare/workers-types@4.20260120.0:index.d.ts:3492", doc = "signature: exec<T extends Record<string, SqlStorageValue>>(query: string, ...bindings: any[]): SqlStorageCursor<T>;" },
  { sym = "global#SqlStorage", class = "query", via = "yield", use = "member:exec", ver = "workers-types-4", at = "@cloudflare/workers-types@4.20260120.0:index.d.ts:3492", doc = "signature: exec<T extends Record<string, SqlStorageValue>>(query: string, ...bindings: any[]): SqlStorageCursor<T>;" },
]

# Entry points: functions the platform calls from outside. kind: 1 request, 2 object method,
# 3 RPC method, 4 scheduled or alarm, 5 queue consumer. A member named by an entry beats the
# general entry for its class.
entries = [
  { sym = "", shape = "default-export-fns", kind = 1, names = ["fetch"], ver = "workers-types-4", at = "@cloudflare/workers-types@4.20260120.0:index.d.ts:512", doc = "signature: fetch?: ExportedHandlerFetchHandler<Env, CfHostMetadata>;" },
  { sym = "", shape = "default-export-fns", kind = 4, names = ["scheduled"], ver = "workers-types-4", at = "@cloudflare/workers-types@4.20260120.0:index.d.ts:516", doc = "signature: scheduled?: ExportedHandlerScheduledHandler<Env>;" },
  { sym = "", shape = "default-export-fns", kind = 5, names = ["queue"], ver = "workers-types-4", at = "@cloudflare/workers-types@4.20260120.0:index.d.ts:519", doc = "signature: queue?: ExportedHandlerQueueHandler<Env, QueueHandlerMessage>;" },
  { sym = "cloudflare:workers#DurableObject", shape = "subclass-methods", kind = 1, names = ["fetch"], ver = "workers-types-4", at = "@cloudflare/workers-types@4.20260120.0:index.d.ts:11384", doc = "signature: fetch?(request: Request): Response | Promise<Response>;" },
  { sym = "cloudflare:workers#DurableObject", shape = "subclass-methods", kind = 2, ver = "workers-types-4", at = "@cloudflare/workers-types@4.20260120.0:index.d.ts:11376", doc = "signature: export abstract class DurableObject<Env = Cloudflare.Env, Props = {}>" },
  { sym = "cloudflare:workers#DurableObject", shape = "subclass-methods", kind = 4, names = ["alarm"], ver = "workers-types-4", at = "@cloudflare/workers-types@4.20260120.0:index.d.ts:11383", doc = "signature: alarm?(alarmInfo?: AlarmInvocationInfo): void | Promise<void>;" },
  { sym = "cloudflare:workers#WorkerEntrypoint", shape = "subclass-methods", kind = 1, names = ["fetch"], ver = "workers-types-4", at = "@cloudflare/workers-types@4.20260120.0:index.d.ts:11364", doc = "signature: fetch?(request: Request): Response | Promise<Response>;" },
  { sym = "cloudflare:workers#WorkerEntrypoint", shape = "subclass-methods", kind = 3, ver = "workers-types-4", at = "@cloudflare/workers-types@4.20260120.0:index.d.ts:11356", doc = "signature: export abstract class WorkerEntrypoint<Env = Cloudflare.Env, Props = {}>" },
  { sym = "cloudflare:workers#WorkerEntrypoint", shape = "subclass-methods", kind = 4, names = ["scheduled"], ver = "workers-types-4", at = "@cloudflare/workers-types@4.20260120.0:index.d.ts:11366", doc = "signature: scheduled?(controller: ScheduledController): void | Promise<void>;" },
  { sym = "cloudflare:workers#WorkerEntrypoint", shape = "subclass-methods", kind = 5, names = ["queue"], ver = "workers-types-4", at = "@cloudflare/workers-types@4.20260120.0:index.d.ts:11365", doc = "signature: queue?(batch: MessageBatch<unknown>): void | Promise<void>;" },
]

# Fan-out: a query call at loop depth > 0, or a loop call of a function that reaches one within two
# call edges (edges = 2). none = 4: test code is left out. D1 has a batch form that sends the
# statements in one round trip, which is the evidence that a query per loop iteration has a cheaper
# shape.
fanouts = [
  { id = "cloudflare.query-in-loop", class = "query", edges = 2, none = 4, says = "runs a D1 or Durable Object SQL query once per loop iteration, directly or through a repo function it calls", ver = "1", at = "@cloudflare/workers-types@4.20260120.0:index.d.ts:10536", doc = "signature: batch<T = unknown>(statements: D1PreparedStatement[]): Promise<D1Result<T>[]>;" },
]

# Hot path: a base finding in a function an entry point above reaches within three call edges
# (depth = 3), so it runs per request, alarm or message. The unindexed-query rule needs
# `sql.unindexed-filter` in policy.toml [rules] enable, and the fan-out rule builds on
# cloudflare.query-in-loop.
hots = [
  { id = "cloudflare.hot-query-fan-out", lane = "fanout", base = "cloudflare.query-in-loop", depth = 3, says = "runs a query per loop iteration in code that a request, alarm or queue entry point reaches", ver = "1", at = "@cloudflare/workers-types@4.20260120.0:index.d.ts:512", doc = "signature: fetch?: ExportedHandlerFetchHandler<Env, CfHostMetadata>;" },
  { id = "cloudflare.hot-unindexed-query", lane = "sql", base = "sql.unindexed-filter", depth = 3, says = "runs a query that filters on a column no index covers, in code that a request, alarm or queue entry point reaches", ver = "1", at = "@cloudflare/workers-types@4.20260120.0:index.d.ts:512", doc = "signature: fetch?: ExportedHandlerFetchHandler<Env, CfHostMetadata>;" },
]

# Unbounded growth: a SELECT with no LIMIT that binds no key of a table, in a table that code an entry
# point reaches within three call edges (depth = 3) inserts into, so the read costs more with every
# request. Needs the schema (.sql files) to be complete.
growths = [
  { id = "cloudflare.unbounded-growth", depth = 3, says = "reads a table in full with no LIMIT and no key, while code that a request, alarm or queue entry point reaches inserts into it", ver = "1", at = "@cloudflare/workers-types@4.20260120.0:index.d.ts:512", doc = "signature: fetch?: ExportedHandlerFetchHandler<Env, CfHostMetadata>;" },
]
