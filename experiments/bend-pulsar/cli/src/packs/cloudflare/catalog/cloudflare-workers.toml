# Cloudflare Workers pack catalog: the platform's D1 and Durable Object SQL surfaces and the
# module-level `env` import. Framework-specific: switched on by evidence, never by default.
# One entry per line, sorted by (sym, via, use, ver). at: the declaration line that justifies the
# class in @cloudflare/workers-types; doc starts with "signature:" when the line has no prose.
format = "pulsar-catalog 0"
id = "cloudflare-workers"
scope = "pack"
activate = ["dep:@cloudflare/workers-types", "dep:wrangler", "file:wrangler.json", "file:wrangler.jsonc", "file:wrangler.toml", "import:cloudflare:*"]
sources = ["@cloudflare/workers-types@4.20260120.0 index.d.ts"]

