format = "pulsar-policy 0"

# Pulsar policy for this repository (committed and fingerprinted; shared by every seat).
# Dogfood v0: Rust for the rewrite's CLI, TS for the repo's tools and scripts. The legacy
# 0.3.0 packages (packages/) are left out: they are replaced by the rewrite, not improved.

[lanes.bend]
include = [
  "experiments/bend-pulsar/",
]

# core.cognitive (SonarSource cognitive complexity) has weak evidence, so it is off by default; this
# repo turns it on to gather evidence on its own code (lead ruling, research/cognitive-complexity.md).
[rules]
enable = [
  "core.cognitive",
]

[lanes.rust]
include = [
  "experiments/bend-pulsar/cli/",
]

[lanes.ts]
include = [
  "experiments/bend-pulsar/baseline/tools/",
  "experiments/bend-pulsar/bench/oracle/",
  "experiments/bend-pulsar/cli/tools/",
  "scripts/",
]
exclude = [
  "experiments/bend-pulsar/bench/oracle/fixtures/",
  "scripts/fixtures/",
]
